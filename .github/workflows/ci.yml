name: CI

on:
  push:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emarket_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emarket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emarket_test?schema=public
      NODE_ENV: test
      CI: true
      PORT: 3000
      APP_PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
      PRISMA_HIDE_UPDATE_MESSAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          until (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; do
            sleep 1
          done

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Run quality checks
        run: pnpm check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emarket_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emarket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emarket_test?schema=public
      NODE_ENV: production
      CI: true
      PORT: 3000
      APP_PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
      PRISMA_HIDE_UPDATE_MESSAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Build application
        run: pnpm build

      - name: Build runtime container
        run: docker build --target runner --tag emarket-ci .

      - name: Start runtime container
        run: >-
          docker run --detach --name emarket-ci
          --add-host host.docker.internal:host-gateway
          --publish 3000:3000
          --env DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/emarket_test?schema=public
          emarket-ci

      - name: Smoke test runtime container
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/products >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs emarket-ci
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/ >/dev/null

      - name: Stop runtime container
        if: always()
        run: docker rm --force emarket-ci || true
